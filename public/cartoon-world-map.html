<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Cartoon World Map</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet"/>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1a0a00;
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh;
    font-family: 'Fredoka One', cursive;
  }
  .map-container {
    width: 100vw; max-width: 1400px;
    aspect-ratio: 2/1;
    position: relative;
  }
  svg { width: 100%; height: 100%; }

  /* Animated wave lines */
  @keyframes waveShift {
    0%   { transform: translateX(0); }
    100% { transform: translateX(-120px); }
  }
  .wave-line { animation: waveShift 4s linear infinite; }
  .wave-line2 { animation: waveShift 6s linear infinite reverse; }
  .wave-line3 { animation: waveShift 5s linear infinite; animation-delay: -2s; }

  /* Floating clouds */
  @keyframes cloudDrift {
    0%   { transform: translateX(0px); }
    50%  { transform: translateX(18px); }
    100% { transform: translateX(0px); }
  }
  .cloud1 { animation: cloudDrift 8s ease-in-out infinite; }
  .cloud2 { animation: cloudDrift 11s ease-in-out infinite; animation-delay: -3s; }
  .cloud3 { animation: cloudDrift 9s ease-in-out infinite; animation-delay: -5s; }

  /* Compass spin on hover */
  @keyframes compassPulse {
    0%,100% { transform: scale(1); }
    50%      { transform: scale(1.05); }
  }
  .compass-group { animation: compassPulse 3s ease-in-out infinite; transform-origin: 1780px 880px; }

  /* Ship bob */
  @keyframes shipBob {
    0%,100% { transform: translateY(0); }
    50%      { transform: translateY(-5px); }
  }
  .ship { animation: shipBob 3s ease-in-out infinite; }
  .ship2 { animation: shipBob 3.8s ease-in-out infinite; animation-delay: -1.5s; }

  /* Star twinkle */
  @keyframes twinkle {
    0%,100% { opacity: 0.9; }
    50%      { opacity: 0.3; }
  }
  .star1 { animation: twinkle 2s ease-in-out infinite; }
  .star2 { animation: twinkle 2.8s ease-in-out infinite; animation-delay: -1s; }
  .star3 { animation: twinkle 3.5s ease-in-out infinite; animation-delay: -2s; }

  /* Sea monster bob */
  @keyframes monsterBob {
    0%,100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-8px) rotate(3deg); }
  }
  .monster { animation: monsterBob 4s ease-in-out infinite; }

  /* Title bounce */
  @keyframes titlePop {
    0%   { transform: scale(0.8); opacity: 0; }
    70%  { transform: scale(1.05); }
    100% { transform: scale(1); opacity: 1; }
  }
  .map-title { animation: titlePop 0.8s ease-out forwards; }
</style>
</head>
